<!DOCTYPE html>
<html lang="en">
<head>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<header class="site-header">
    <h1>MEC 2026</h1>
    <a class="sign-in-link" href="/management">Sign in</a>
</header>

 

<div id="map" class="box">
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='mapScript.js') }}"></script>
</div>




<div class="request-section">
    <button id="request" onclick="ShowForm()">Request</button>
</div>




<div id="foodModal" class="modal-overlay">

    <div class="modal-content">

        <button class="close-modal" id="closeFoodForm" onclick="hideForm()">
            &times;
        </button>

        <h2>Emergency Food Request</h2>
        <p>Enter the destination's food requirements.</p>

        <form id="foodRequestForm" onsubmit="submit_form(event)">

            <h3>Destination Information</h3>

            <label>Destination Name *</label>
            <select name="destination" required>
                <option value="">Select type</option>
                <option value="community">Toronto General Hospital (approximate)</option>
                <option value="shelter">Moss Park delivery site (scenario)</option>
                <option value="hospital">Waterfront delivery site (scenario)</option>
                <option value="hospital">Bloor community delivery (scenario)</option>
            </select>

            <label>Destination Type *</label>
            <select name="type" required>
                <option value="">Select type</option>
                <option value="community">Community</option>
                <option value="shelter">Shelter</option>
                <option value="hospital">Hospital</option>
            </select>

            <label>Number of People</label>
            <input type="number" name="people" min="0">

            <label>Address</label>
            <input type="text" name="address">

            <h3>Food Requirements</h3>
            <div class="food-section">
                <h4>Hot Food</h4>
                <label>Amount Needed</label>
                <input type="number" name="hotNeeded" min="0">

                <label>Amount Remaining</label>
                <input type="number" name="hotRemaining" min="0">
            </div>

            <div class="food-section">
                <h4>Cold Food</h4>
                <label>Amount Needed</label>
                <input type="number" name="coldNeeded" min="0">

                <label>Amount Remaining</label>
                <input type="number" name="coldRemaining" min="0">
            </div>

            <h3>Urgency</h3>

            <label>Delivery Deadline</label>
            <input type="number" name="hours" min="0">

            <label>Urgency Level</label>
            <select name="urgency">
                <option value="">Unknown</option>
                <option value="critical">Critical</option>
                <option value="high">High</option>
                <option value="moderate">Moderate</option>
                <option value="low">Low</option>
            </select>

            <label>Additional Information</label>
            <textarea name="notes" rows="4"></textarea>

            <button type="submit" class="submit-button">
                Submit Request
            </button>

        </form>
    </div>
</div>



</body>
<meta charset="UTF-8">
</html>
